[project]
name = "jem"
version = "0.2.0"
description = "Energy-based option discovery and composition (PyTorch)"
readme = "README.md"
requires-python = ">=3.12,<3.13"
authors = [{ name = "Mahan Fathi", email = "mahan0fathi@gmail.com" }]
dependencies = [
    "torch>=2.9",
    "numpy>=2.0",
    "matplotlib>=3.9",
]

[project.scripts]
jem = "jem.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["jem"]

[tool.uv]
python-preference = "only-managed"
environments = ["sys_platform == 'linux' and platform_machine == 'aarch64'"]
required-environments = ["sys_platform == 'linux' and platform_machine == 'aarch64'"]

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu130" }

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E741"]
